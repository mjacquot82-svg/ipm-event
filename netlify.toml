[build]
  base = "frontend"
  publish = "dist"
  command = "npm install && npm run build:web"

[build.environment]
  EXPO_PUBLIC_BACKEND_URL = "https://ipm-backend-eoiw.onrender.com"

# Production-safe static vendors bake: serve /api/vendors.json for the Vendors
# tab without proxying to staging Render admin, and without writing production DB.
[[redirects]]
  from = "/api/vendors"
  to = "/api/vendors.json"
  status = 200
  force = true

[[headers]]
  for = "/content-manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=30, stale-while-revalidate=30"
    Netlify-CDN-Cache-Control = "public, s-maxage=30, stale-while-revalidate=30"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
