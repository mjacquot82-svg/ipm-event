[build]
  base = "frontend"
  publish = "dist"
  command = "npm install && npm run build:web"

# Vendors tab on staging.theipm.ca serves the baked Sept8 unique-exhibitor
# catalog from /api/vendors.json (status 200). Do NOT proxy /api/vendors to
# production Render — that list is 127 blank-location Google Sheets rows and
# disagrees with the restored Tented City map dataset.
# Other /api routes (admin, schedule via backend URL, etc.) stay on staging.
[[redirects]]
  from = "/api/admin/*"
  to = "https://ipm-staging-backend.onrender.com/api/admin/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/vendors"
  to = "/api/vendors.json"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
