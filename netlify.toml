[build]
  base = "frontend"
  publish = "dist"
  command = "npm install && npm run build:web"

# Vendors tab on staging.theipm.ca should show the live vendor list.
# The browser cannot call production Render from this origin (CORS), so
# same-origin /api/vendors is proxied to production. Other /api routes stay
# on the staging backend (schedule, announcements, what3words).
[[redirects]]
  from = "/api/vendors"
  to = "https://ipm-backend-eoiw.onrender.com/api/vendors"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
