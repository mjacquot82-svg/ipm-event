
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IPM 2026" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <link rel="apple-touch-icon" href="/v2-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/v2-icon.png" />
    
    <link rel="manifest" href="/manifest.json" />
    
    <title>IPM 2026</title>
    
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; }
      #ipm-startup-splash {
        align-items: center;
        background: #F5F5F0;
        box-sizing: border-box;
        display: flex;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        min-height: 100%;
        padding: 24px;
        text-align: center;
      }
      #ipm-startup-splash img { height: auto; max-width: 320px; width: min(72vw, 320px); }
      #ipm-startup-reassurance { color: #3C3C36; margin-top: 20px; max-width: 360px; }
      #ipm-startup-reassurance[hidden] { display: none; }
      #ipm-startup-reassurance strong { color: #20201D; display: block; font-size: 16px; }
      #ipm-startup-reassurance span { display: block; font-size: 14px; line-height: 1.45; margin-top: 7px; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div id="ipm-startup-splash">
        <img src="/v2-icon.png" alt="IPM 2026" />
        <div id="ipm-startup-reassurance" role="status" aria-live="polite" hidden>
          <strong>Limited connection — IPM is still loading</strong>
          <span>We're opening saved event information so you can keep using the app.</span>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var reassurance = document.getElementById('ipm-startup-reassurance');
        var reveal = function () { if (reassurance && reassurance.isConnected) reassurance.hidden = false; };
        if (navigator.onLine === false) reveal();
        else window.setTimeout(reveal, 2500);
      })();
    </script>
  </body>
</html>
